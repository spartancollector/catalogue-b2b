<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spartan Collector — Catalogue B2B</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --gold: #e9c667;
    --gold-dim: #a9906a;
    --bg-deep: #120b05;
    --bg-card: #241a0f;
    --ink: #f2e6c9;
  }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg-deep);
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap { max-width: 1300px; margin: 0 auto; padding: 24px 20px 80px; }

  .header {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 16px;
    border-bottom: 1px solid rgba(233,198,103,0.25);
    padding-bottom: 18px; margin-bottom: 20px;
  }
  .brand { display:flex; align-items:center; gap:14px; }
  .brand-mark { width: 46px; height: 46px; border-radius: 8px; overflow:hidden; }
  .brand-mark img { width:100%; height:100%; object-fit:cover; }
  .brand-name { font-size: 20px; font-weight:bold; letter-spacing:1px; }
  .brand-sub { font-size: 12px; color: var(--gold-dim); }

  input {
    font-family: inherit; background: rgba(0,0,0,0.25);
    border: 1px solid rgba(233,198,103,0.3); border-radius:6px;
    color: var(--ink); padding:8px 10px; font-size:13px;
  }
  input:focus { outline:none; border-color: var(--gold); }

  .toolbar { display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .search { flex:1; min-width:220px; }
  .search input { width:100%; }

  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px; }
  .tab {
    padding:7px 14px; font-size:12px; border-radius:999px;
    border:1px solid rgba(233,198,103,0.35); cursor:pointer; color: var(--gold-dim);
    background: transparent;
  }
  .tab.active { background: var(--gold); color:#20130a; font-weight:bold; border-color:var(--gold); }

  .grid {
    display:grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr));
    gap:14px;
  }
  .card {
    background: var(--bg-card); border:1px solid rgba(233,198,103,0.18);
    border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:8px;
  }
  .card-img { width:100%; height:140px; object-fit:contain; border-radius:6px; background:rgba(0,0,0,0.2); }
  .card-cat { font-size:10px; color: var(--gold-dim); text-transform:uppercase; letter-spacing:0.5px; }
  .card-name { font-size:14px; font-weight:bold; line-height:1.3; }
  .card-sku { font-size:11px; color: var(--gold-dim); font-family: monospace; }
  .card-price { font-size:20px; font-weight:bold; color: var(--gold); }
  .card-notes { font-size:11px; color: var(--gold-dim); font-style:italic; }

  .empty { text-align:center; padding:60px 20px; color: var(--gold-dim); }

  .footer {
    margin-top: 40px; padding-top: 20px;
    border-top: 1px solid rgba(233,198,103,0.2);
    font-size: 13px; color: var(--gold-dim); text-align: center;
  }
  .edit-hint {
    background: rgba(233,198,103,0.08); border:1px solid rgba(233,198,103,0.3);
    border-radius:8px; padding:12px 16px; margin-bottom:20px; font-size:13px;
  }
  .edit-hint a { color: var(--gold); }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="brand">
      <div class="brand-mark"><img src="https://spartan-collector.com/cdn/shop/files/Gemini_Generated_Image_4vu7q04vu7q04vu7.png?height=628&pad_color=ffffff&v=1778686344&width=1200" alt="Spartan Collector"></div>
      <div>
        <div class="brand-name">SPARTAN COLLECTOR</div>
        <div class="brand-sub">Catalogue B2B — TCG Wholesale</div>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="search">
      <input type="text" id="searchInput" placeholder="Rechercher un produit, une référence...">
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" style="display:none;">Aucun produit dans cette catégorie.</div>

  <div class="footer">
    Spartan Collector — Thessaloniki, Greece — spartan-collector.com
  </div>

</div>

<script>
let products = [];
let activeTab = "Tous";

async function loadProducts() {
  try {
    const res = await fetch('products.json?v=' + Date.now());
    products = await res.json();
  } catch (e) {
    document.getElementById('grid').innerHTML = '<div class="empty">Erreur de chargement des produits.</div>';
    return;
  }
  render();
}

function renderTabs() {
  const tabsEl = document.getElementById("tabs");
  const cats = [...new Set(products.map(p => p.category))];
  const counts = {};
  products.forEach(p => { counts[p.category] = (counts[p.category] || 0) + 1; });
  const allTabs = ["Tous", ...cats];
  tabsEl.innerHTML = allTabs.map(cat => {
    const count = cat === "Tous" ? products.length : (counts[cat] || 0);
    const activeClass = activeTab === cat ? "active" : "";
    return `<div class="tab ${activeClass}" data-cat="${cat}">${cat} (${count})</div>`;
  }).join("");
  tabsEl.querySelectorAll(".tab").forEach(el => {
    el.addEventListener("click", () => { activeTab = el.dataset.cat; render(); });
  });
}

function renderGrid() {
  const grid = document.getElementById("grid");
  const searchTerm = document.getElementById("searchInput").value.toLowerCase();
  let filtered = products.filter(p => {
    const matchCat = activeTab === "Tous" || p.category === activeTab;
    const matchSearch = !searchTerm || p.name.toLowerCase().includes(searchTerm) || p.sku.toLowerCase().includes(searchTerm);
    return matchCat && matchSearch;
  });

  document.getElementById("emptyState").style.display = filtered.length === 0 ? "block" : "none";
  grid.innerHTML = filtered.map(p => {
    return `
      <div class="card">
        ${p.img ? `<img class="card-img" src="${p.img}" alt="${p.name}" loading="lazy">` : ""}
        <div class="card-cat">${p.category}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-sku">${p.sku}</div>
        <div class="card-price">${p.price.toFixed(2)} €</div>
        ${p.notes ? `<div class="card-notes">${p.notes}</div>` : ""}
      </div>`;
  }).join("");
}

function render() {
  renderTabs();
  renderGrid();
}

document.getElementById("searchInput").addEventListener("input", render);
loadProducts();
</script>
</body>
</html>
